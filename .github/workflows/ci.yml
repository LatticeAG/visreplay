name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Reject network imports in src
        run: |
          pattern="fetch\\(|node:http|node:https|node:net|from 'http'|from 'https'|from 'undici'|require\\('http|undici|axios|node-fetch"
          if command -v rg >/dev/null 2>&1; then
            if rg -n "$pattern" src; then
              echo "Network import found in src/"
              exit 1
            fi
          else
            if git grep -nE "$pattern" -- src; then
              echo "Network import found in src/"
              exit 1
            fi
          fi
      - name: Pack and install tarball
        run: |
          tarball=$(npm pack | tail -n 1)
          workdir=$(mktemp -d)
          cd "$workdir"
          npm init -y
          npm install "$GITHUB_WORKSPACE/$tarball"
          node -e "const { VisReplay, exportInterop } = require('@latticeag/visreplay'); const r = new VisReplay(); r.recordDecision({ believed: { tests: 'green' } }); if (!exportInterop) process.exit(1); process.exit(r.getEvents()[0].metadata.visreplay.kind === 'decision' ? 0 : 1)"
          npx visreplay --help
